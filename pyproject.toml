[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dictation"
version = "0.1.0"
description = "100% local dictation system with keyword activation for macOS"
requires-python = ">=3.11"
dependencies = [
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "silero-vad>=5.1",
    "torch>=2.1.0",
    "mlx-whisper>=0.4.0",
    "pynput>=1.7.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
dictation = "dictation.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dictation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
